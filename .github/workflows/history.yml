# Index chart data for the Mudra Monk app (history.json).
# Runs separately from the website's "prices" workflow and never edits prices.json or stocks.json.
name: history
on:
  schedule:
    - cron: "5,25,45 3-10 * * 1-5"   # every 20 min during market hours (IST 08:35-16:45), Mon-Fri
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python history.py > history-log.txt 2>&1 || true
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add history.json history-log.txt 2>/dev/null || true
          git commit -m history || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

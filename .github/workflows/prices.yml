name: prices
on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py > log.txt 2>&1 || true
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m prices || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
